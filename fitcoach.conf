# Configuración de Apache VirtualHost como Proxy Inverso para FitCoach Pro
# IP Servidor: 192.168.1.21
#
# Para aplicar esta configuración en Ubuntu Server:
# 1. Copiar este archivo a Apache:
#    sudo cp fitcoach.conf /etc/apache2/sites-available/fitcoach.conf
# 2. Habilitar los módulos necesarios:
#    sudo a2enmod proxy proxy_http rewrite
# 3. Habilitar el VirtualHost:
#    sudo a2ensite fitcoach.conf
# 4. Probar la configuración y reiniciar Apache:
#    sudo apache2ctl configtest
#    sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName 192.168.1.21
    ServerAlias fitcoach.local

    # Frontend (Archivos estáticos HTML, CSS, JS)
    DocumentRoot /var/www/fitcoach-pro/frontend

    <Directory /var/www/fitcoach-pro/frontend>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Soporte para la ruta alternativa /plataforma-entrenamiento/frontend si aplica
    <Directory /var/www/fitcoach-pro/plataforma-entrenamiento/frontend>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Habilitar cabeceras proxy
    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy Inverso para Microservicios Node.js (PM2)

    # 1. Microservicio de Usuarios y Autenticación (Puerto 3001)
    ProxyPass /api/auth http://127.0.0.1:3001/api/auth
    ProxyPassReverse /api/auth http://127.0.0.1:3001/api/auth

    ProxyPass /api/usuarios http://127.0.0.1:3001/api/usuarios
    ProxyPassReverse /api/usuarios http://127.0.0.1:3001/api/usuarios

    # 2. Microservicio de Entrenamientos y Videos (Puerto 3002)
    ProxyPass /api/videos http://127.0.0.1:3002/api/videos
    ProxyPassReverse /api/videos http://127.0.0.1:3002/api/videos

    ProxyPass /api/entrenamientos http://127.0.0.1:3002/api/entrenamientos
    ProxyPassReverse /api/entrenamientos http://127.0.0.1:3002/api/entrenamientos

    # 3. Microservicio de Nutrición (Puerto 3003)
    ProxyPass /api/nutricion http://127.0.0.1:3003/api/nutricion
    ProxyPassReverse /api/nutricion http://127.0.0.1:3003/api/nutricion

    # 4. Microservicio de Recompensas (Puerto 3004)
    ProxyPass /api/recompensas http://127.0.0.1:3004/api/recompensas
    ProxyPassReverse /api/recompensas http://127.0.0.1:3004/api/recompensas

    # Health Checks (mapeos individuales para monitoreo)
    ProxyPass /api/health/usuarios http://127.0.0.1:3001/api/health
    ProxyPassReverse /api/health/usuarios http://127.0.0.1:3001/api/health

    ProxyPass /api/health/entrenamientos http://127.0.0.1:3002/api/health
    ProxyPassReverse /api/health/entrenamientos http://127.0.0.1:3002/api/health

    ProxyPass /api/health/nutricion http://127.0.0.1:3003/api/health
    ProxyPassReverse /api/health/nutricion http://127.0.0.1:3003/api/health

    ProxyPass /api/health/recompensas http://127.0.0.1:3004/api/health
    ProxyPassReverse /api/health/recompensas http://127.0.0.1:3004/api/health

    # Registros de Apache
    ErrorLog ${APACHE_LOG_DIR}/fitcoach_error.log
    CustomLog ${APACHE_LOG_DIR}/fitcoach_access.log combined
</VirtualHost>

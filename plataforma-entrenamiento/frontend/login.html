<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar sesión – FitCoach Pro</title>
  <link rel="stylesheet" href="style.css">

    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

  <style>
    .auth-container {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-card {
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .auth-card h1 {
      font-size: 1.6rem;
      margin-bottom: 0.4rem;
      text-align: center;
    }
    .auth-card .subtitle {
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .auth-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.6rem;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
    }
    .auth-tab.active {
      background: var(--primary);
      color: var(--bg);
      border-color: var(--primary);
    }
    .auth-error {
      background: rgba(248,113,113,0.15);
      color: #f87171;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .auth-success {
      background: rgba(52,211,153,0.15);
      color: #34d399;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">FitCoach <span>Pro</span></div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="precios.html" class="nav-link">Precios</a>
    </div>
    <a href="login.html" class="btn btn-primary btn-sm">Iniciar sesión</a>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h1>Bienvenido</h1>
      <p class="subtitle">Inicia sesión o crea tu cuenta para acceder a tu entrenamiento</p>

      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Iniciar sesión</div>
        <div class="auth-tab" data-tab="registro">Crear cuenta</div>
      </div>

      <div id="mensajeError" class="auth-error"></div>
      <div id="mensajeExito" class="auth-success"></div>

      <!-- Formulario Login -->
      <form id="formLogin">
        <div class="form-group">
          <label for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Entrar</button>
      </form>

      <!-- Formulario Registro -->
      <form id="formRegistro" style="display:none;">
        <div class="form-group">
          <label for="regNombre">Nombre completo</label>
          <input type="text" id="regNombre" placeholder="Tu nombre" required>
        </div>
        <div class="form-group">
          <label for="regEmail">Correo electrónico</label>
          <input type="email" id="regEmail" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label for="regPassword">Contraseña</label>
          <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Crear cuenta</button>
      </form>

      <div class="auth-footer">
        <a href="index.html">← Volver al inicio</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-bottom">
      © 2026 FitCoach Pro – Proyecto académico para análisis UX con Microsoft Clarity
    </div>
  </footer>

  <script>
    // Si ya tiene sesión, redirigir al entrenamiento
    if (localStorage.getItem('fitcoach_sesion')) {
      window.location.href = 'entrenamiento.html';
    }

    // Tabs
    const tabs = document.querySelectorAll('.auth-tab');
    const formLogin = document.getElementById('formLogin');
    const formRegistro = document.getElementById('formRegistro');
    const mensajeError = document.getElementById('mensajeError');
    const mensajeExito = document.getElementById('mensajeExito');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        mensajeError.style.display = 'none';
        mensajeExito.style.display = 'none';

        if (tab.dataset.tab === 'login') {
          formLogin.style.display = 'block';
          formRegistro.style.display = 'none';
        } else {
          formLogin.style.display = 'none';
          formRegistro.style.display = 'block';
        }
      });
    });

    function mostrarError(texto) {
      mensajeError.textContent = texto;
      mensajeError.style.display = 'block';
      mensajeExito.style.display = 'none';
    }

    function mostrarExito(texto) {
      mensajeExito.textContent = texto;
      mensajeExito.style.display = 'block';
      mensajeError.style.display = 'none';
    }

    // Login
    formLogin.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const usuarios = JSON.parse(localStorage.getItem('fitcoach_usuarios') || '[]');
      const usuario = usuarios.find(u => u.email === email && u.password === password);

      if (!usuario) {
        mostrarError('Correo o contraseña incorrectos.');
        return;
      }

      // Guardar sesión
      localStorage.setItem('fitcoach_sesion', JSON.stringify({
        nombre: usuario.nombre,
        email: usuario.email,
        fecha: new Date().toISOString()
      }));

      mostrarExito('¡Bienvenido! Redirigiendo...');
      setTimeout(() => {
        window.location.href = 'entrenamiento.html';
      }, 800);
    });

    // Registro
    formRegistro.addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = document.getElementById('regNombre').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (password.length < 6) {
        mostrarError('La contraseña debe tener al menos 6 caracteres.');
        return;
      }

      const usuarios = JSON.parse(localStorage.getItem('fitcoach_usuarios') || '[]');

      if (usuarios.some(u => u.email === email)) {
        mostrarError('Ya existe una cuenta con ese correo.');
        return;
      }

      usuarios.push({ nombre, email, password });
      localStorage.setItem('fitcoach_usuarios', JSON.stringify(usuarios));

      // Iniciar sesión automáticamente
      localStorage.setItem('fitcoach_sesion', JSON.stringify({
        nombre,
        email,
        fecha: new Date().toISOString()
      }));

      mostrarExito('Cuenta creada. Redirigiendo...');
      setTimeout(() => {
        window.location.href = 'entrenamiento.html';
      }, 800);
    });
  </script>
</body>
</html>
